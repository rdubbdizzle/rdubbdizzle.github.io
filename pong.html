<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Terminal Pong — SpaceAFinder</title>
  <meta name="description" content="Kill time between Space-A roll calls. Terminal Pong on SpaceAFinder." />
  <meta name="theme-color" content="#090b10" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
  <style>
    .pong-stage { max-width: var(--max); margin: 0 auto; padding: 0 var(--space-5) var(--space-7); }
    .court-wrap {
      position: relative;
      height: min(64vh, 560px);
      min-height: 280px;
      background: #0b1220;
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow);
      touch-action: none;
    }
    #court { display: block; width: 100%; height: 100%; }
    .overlay {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      background: rgba(9, 11, 16, 0.55);
      color: #eef1f6;
    }
    .overlay.hidden { display: none; }
    .panel { text-align: center; padding: 24px; }
    .panel h2 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 600;
    }
    .panel p { color: var(--fg-muted); margin: 8px 0 18px; }
    .panel .score { font-family: var(--font-mono); font-size: 2rem; color: var(--fg); }
    .play-btn {
      appearance: none; border: 0;
      background: var(--accent); color: var(--accent-fg);
      font: 600 1rem var(--font-body);
      padding: 12px 22px; min-height: 44px; border-radius: var(--radius-sm);
    }
    .play-btn:active { scale: 0.96; }
    .toolbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin: 16px 0 12px; color: var(--fg-muted); font-size: 0.9rem;
    }
    .toolbar .actions { display: flex; gap: 8px; }
    .toolbar button {
      appearance: none; border: 0; background: var(--bg-elevated);
      color: var(--fg); box-shadow: var(--shadow);
      min-height: 40px; padding: 8px 14px; border-radius: var(--radius-sm);
      font: 600 0.85rem var(--font-body);
    }
    .help { color: var(--fg-subtle); font-size: 0.85rem; margin-top: 10px; }
  </style>
</head>
<body>
<div class="site-wrap">
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M6 22h20M10 18h12M14 14h8" stroke="currentColor" stroke-width="2" fill="none"/><path d="M16 8l3 5h-6z" fill="currentColor"/></svg>
      </span>
      <span class="brand-name">SpaceAFinder</span>
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="index.html">Flights</a>
      <a href="jblm.html">McChord</a>
      <a href="travis.html">Travis</a>
      <a href="guide.html">How it works</a>
      <a class="pong-link active" href="pong.html">Terminal Pong</a>
    </nav>
  </header>

  <div class="page-hero">
    <a class="crumb" href="index.html">← Flight board</a>
    <div class="kicker">Between roll calls</div>
    <h1>Terminal Pong</h1>
  </div>

  <div class="pong-stage">
    <div class="toolbar">
      <div id="meta">First to 7</div>
      <div class="actions">
        <button type="button" id="mute" aria-label="Mute">Mute</button>
        <button type="button" id="pause" hidden aria-label="Pause">Pause</button>
      </div>
    </div>
    <div class="court-wrap" id="wrap">
      <canvas id="court" width="900" height="560" aria-label="Pong court"></canvas>
      <div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>
    </div>
    <p class="help">W/S or arrows · drag the left paddle · P pauses · first to 7. Left paddle is yours.</p>
  </div>

  <footer class="site-footer">
    <div class="inner">
      <p>Then get back to the board.</p>
      <p><a href="schedule.html">McChord 72-hour</a></p>
    </div>
  </footer>
</div>
<script>
(() => {
  const canvas = document.getElementById("court");
  const wrap = document.getElementById("wrap");
  const overlay = document.getElementById("overlay");
  const panel = document.getElementById("panel");
  const meta = document.getElementById("meta");
  const muteBtn = document.getElementById("mute");
  const pauseBtn = document.getElementById("pause");
  const ctx = canvas.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const W = 900, H = 560, PW = 14, PH = 96, BR = 8, WIN = 7;
  const PLAYER_SPEED = 520, AI_SPEED = 340, B0 = 420, BMAX = 860, GAIN = 1.045;
  const FIXED = 1 / 120;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const paddleTop = (y) => clamp(y, 18 + PH / 2, H - 18 - PH / 2);
  const BEST_KEY = "saf-pong-best";
  const readBest = () => { try { return +localStorage.getItem(BEST_KEY) || 0; } catch { return 0; } };
  const writeBest = (n) => { try { localStorage.setItem(BEST_KEY, String(n)); } catch {} };

  const s = {
    playerY: H / 2, aiY: H / 2, aiTarget: H / 2,
    ballX: W / 2, ballY: H / 2, ballVx: 0, ballVy: 0,
    playerScore: 0, aiScore: 0, phase: "idle", serveDir: 1,
    serveTimer: 0, countdown: 0, winner: null,
    particles: [], trauma: 0, paddleFlashL: 0, paddleFlashR: 0,
    hitstop: 0, lastAiThink: 0
  };
  const keys = new Set();
  let pointerY = null, last = performance.now(), acc = 0;
  let audioCtx = null, master = null, muted = false;

  function unlockAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      master = audioCtx.createGain();
      master.gain.value = muted ? 0 : 1;
      master.connect(audioCtx.destination);
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
  }
  function beep(freq, dur, type, gain) {
    if (!audioCtx || muted) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(gain * 0.08, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(g); g.connect(master);
    osc.start(now); osc.stop(now + dur + 0.02);
  }
  function spawnBurst(x, y, dirX, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.atan2(Math.random() - 0.5, dirX) + (Math.random() - 0.5) * 0.8;
      const sp = 80 + Math.random() * 220;
      s.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.22 + Math.random() * 0.28, max: 0.5, size: 1.5 + Math.random() * 2.5 });
    }
    if (s.particles.length > 80) s.particles.splice(0, s.particles.length - 80);
  }
  function resetBall(dir) {
    s.ballX = W / 2; s.ballY = H / 2 + (Math.random() - 0.5) * 80;
    s.ballVx = 0; s.ballVy = 0; s.serveDir = dir;
    s.serveTimer = 0.85; s.phase = "countdown"; s.countdown = 0.85;
    renderHud();
  }
  function launchBall() {
    const angle = (Math.random() * 0.5 - 0.25) * Math.PI;
    s.ballVx = Math.cos(angle) * B0 * s.serveDir;
    s.ballVy = Math.sin(angle) * B0;
    s.phase = "play";
    renderHud();
  }
  function startMatch() {
    unlockAudio();
    s.playerScore = 0; s.aiScore = 0; s.winner = null;
    s.playerY = H / 2; s.aiY = H / 2; s.trauma = 0; s.particles.length = 0;
    resetBall(Math.random() < 0.5 ? 1 : -1);
  }
  function togglePause() {
    if (s.phase === "play" || s.phase === "countdown") s.phase = "pause";
    else if (s.phase === "pause") s.phase = s.countdown > 0 ? "countdown" : "play";
    renderHud();
  }
  function step(dt) {
    s.trauma = Math.max(0, s.trauma - dt * 2.4);
    s.paddleFlashL = Math.max(0, s.paddleFlashL - dt * 4);
    s.paddleFlashR = Math.max(0, s.paddleFlashR - dt * 4);
    for (let i = s.particles.length - 1; i >= 0; i--) {
      const p = s.particles[i];
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98; p.vy *= 0.98;
      if (p.life <= 0) s.particles.splice(i, 1);
    }
    if (s.phase === "idle" || s.phase === "over" || s.phase === "pause") return;
    if (s.hitstop > 0) { s.hitstop -= dt; return; }
    const move = (keys.has("KeyW") || keys.has("ArrowUp") ? -1 : 0) + (keys.has("KeyS") || keys.has("ArrowDown") ? 1 : 0);
    s.playerY = paddleTop(s.playerY + move * PLAYER_SPEED * dt);
    if (pointerY != null) s.playerY = paddleTop(s.playerY + (pointerY - s.playerY) * (1 - Math.exp(-18 * dt)));
    s.lastAiThink += dt;
    if (s.lastAiThink > 0.09) {
      s.lastAiThink = 0;
      const error = (Math.random() - 0.5) * 46;
      s.aiTarget = s.ballVx > 0 ? s.ballY + error : H / 2 + error * 0.4;
    }
    s.aiY = paddleTop(s.aiY + clamp(s.aiTarget - s.aiY, -AI_SPEED * dt, AI_SPEED * dt));
    if (s.phase === "countdown") {
      s.countdown -= dt; s.serveTimer -= dt;
      if (s.serveTimer <= 0) launchBall();
      return;
    }
    s.ballX += s.ballVx * dt; s.ballY += s.ballVy * dt;
    if (s.ballY - BR <= 0) { s.ballY = BR; s.ballVy = Math.abs(s.ballVy); beep(220, 0.045, "triangle", 0.5); if (!reduced) s.trauma = Math.min(1, s.trauma + 0.12); }
    else if (s.ballY + BR >= H) { s.ballY = H - BR; s.ballVy = -Math.abs(s.ballVy); beep(220, 0.045, "triangle", 0.5); if (!reduced) s.trauma = Math.min(1, s.trauma + 0.12); }
    const leftX = 28, rightX = W - 28;
    if (s.ballVx < 0 && s.ballX - BR <= leftX + PW / 2 && s.ballX - BR >= leftX - PW && Math.abs(s.ballY - s.playerY) <= PH / 2 + BR) {
      const off = clamp((s.ballY - s.playerY) / (PH / 2), -1, 1);
      const speed = Math.min(BMAX, Math.hypot(s.ballVx, s.ballVy) * GAIN);
      const angle = off * 0.7;
      s.ballVx = Math.cos(angle) * speed; s.ballVy = Math.sin(angle) * speed;
      s.ballX = leftX + PW / 2 + BR + 0.5; s.paddleFlashL = 1; s.hitstop = reduced ? 0 : 0.032;
      if (!reduced) s.trauma = Math.min(1, s.trauma + 0.28);
      spawnBurst(s.ballX, s.ballY, 1, 12); beep(420, 0.06, "square", 0.9);
    }
    if (s.ballVx > 0 && s.ballX + BR >= rightX - PW / 2 && s.ballX + BR <= rightX + PW && Math.abs(s.ballY - s.aiY) <= PH / 2 + BR) {
      const off = clamp((s.ballY - s.aiY) / (PH / 2), -1, 1);
      const speed = Math.min(BMAX, Math.hypot(s.ballVx, s.ballVy) * GAIN);
      const angle = Math.PI - off * 0.7;
      s.ballVx = Math.cos(angle) * speed; s.ballVy = Math.sin(angle) * speed;
      s.ballX = rightX - PW / 2 - BR - 0.5; s.paddleFlashR = 1; s.hitstop = reduced ? 0 : 0.032;
      if (!reduced) s.trauma = Math.min(1, s.trauma + 0.28);
      spawnBurst(s.ballX, s.ballY, -1, 12); beep(390, 0.06, "square", 0.9);
    }
    if (s.ballX + BR < 0) {
      s.aiScore += 1; beep(160, 0.18, "sawtooth", 0.55);
      if (!reduced) s.trauma = Math.min(1, s.trauma + 0.55);
      if (s.aiScore >= WIN) { s.phase = "over"; s.winner = "ai"; beep(180, 0.28, "triangle", 0.6); }
      else resetBall(1);
      renderHud();
    } else if (s.ballX - BR > W) {
      s.playerScore += 1; beep(160, 0.18, "sawtooth", 0.55);
      if (!reduced) s.trauma = Math.min(1, s.trauma + 0.55);
      if (s.playerScore >= WIN) {
        s.phase = "over"; s.winner = "player";
        beep(520, 0.12, "square", 0.7);
        setTimeout(() => beep(780, 0.18, "square", 0.7), 90);
        writeBest(Math.max(readBest(), s.playerScore));
      } else resetBall(-1);
      renderHud();
    }
  }
  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }
  function draw(now) {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const cssW = canvas.width / dpr, cssH = canvas.height / dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);
    const scale = Math.min(cssW / W, cssH / H);
    const ox = (cssW - W * scale) / 2, oy = (cssH - H * scale) / 2;
    const shake = s.trauma * s.trauma;
    ctx.save();
    ctx.translate(ox + Math.sin(now * 61.2) * 7 * shake * scale, oy + Math.cos(now * 53.7) * 5 * shake * scale);
    ctx.scale(scale, scale);
    ctx.fillStyle = "#0b1220"; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(200,208,220,.14)"; ctx.lineWidth = 2; ctx.strokeRect(10, 10, W - 20, H - 20);
    ctx.setLineDash([10, 16]); ctx.strokeStyle = "rgba(200,208,220,.28)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(W / 2, 22); ctx.lineTo(W / 2, H - 22); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "rgba(238,241,246,.55)";
    ctx.font = "600 64px IBM Plex Mono, ui-monospace, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.fillText(String(s.playerScore), W / 2 - 72, 28);
    ctx.fillText(String(s.aiScore), W / 2 + 72, 28);
    ctx.fillStyle = "rgba(200,208,220,.45)";
    ctx.font = "500 13px IBM Plex Sans, sans-serif";
    ctx.fillText("YOU", W / 2 - 72, 98);
    ctx.fillText("TOWER", W / 2 + 72, 98);
    ctx.fillStyle = s.paddleFlashL > 0 ? `rgba(238,241,246,${0.75 + s.paddleFlashL * 0.25})` : "#e8eef8";
    roundRect(28 - PW / 2, s.playerY - PH / 2, PW, PH, 4); ctx.fill();
    ctx.fillStyle = s.paddleFlashR > 0 ? `rgba(238,241,246,${0.75 + s.paddleFlashR * 0.25})` : "#e8eef8";
    roundRect(W - 28 - PW / 2, s.aiY - PH / 2, PW, PH, 4); ctx.fill();
    for (const p of s.particles) {
      ctx.fillStyle = `rgba(200,208,220,${Math.max(0, p.life / p.max)})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    if (s.phase !== "idle") {
      ctx.fillStyle = "#f4f6f9";
      ctx.shadowColor = "rgba(200,208,220,.55)"; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(s.ballX, s.ballY, BR, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }
  function renderHud() {
    const best = readBest();
    meta.textContent = "First to " + WIN + (best > 0 ? " · Best " + best : "");
    pauseBtn.hidden = !(s.phase === "play" || s.phase === "countdown" || s.phase === "pause");
    pauseBtn.textContent = s.phase === "pause" ? "Resume" : "Pause";
    pauseBtn.setAttribute("aria-label", s.phase === "pause" ? "Resume" : "Pause");
    if (s.phase === "play") { overlay.classList.add("hidden"); return; }
    overlay.classList.remove("hidden");
    if (s.phase === "idle") {
      panel.innerHTML = "<h2>Pong</h2><p>Drag or use W/S and arrows. Beat the tower to " + WIN + ".</p><button class=\"play-btn\" id=\"go\" type=\"button\">Play</button>";
    } else if (s.phase === "pause") {
      panel.innerHTML = "<h2>Paused</h2><p>Press P or tap Resume.</p><button class=\"play-btn\" id=\"go\" type=\"button\">Resume</button>";
    } else if (s.phase === "countdown") {
      panel.innerHTML = "<p class=\"score\" style=\"letter-spacing:.2em;text-transform:uppercase\">Serving</p>";
    } else if (s.phase === "over") {
      panel.innerHTML = "<h2>" + (s.winner === "player" ? "You win" : "Tower wins") + "</h2><p class=\"score\">" + s.playerScore + " – " + s.aiScore + "</p><button class=\"play-btn\" id=\"go\" type=\"button\">Play again</button>";
    }
    const go = document.getElementById("go");
    if (go) go.addEventListener("click", () => { if (s.phase === "pause") togglePause(); else startMatch(); });
  }
  function resize() {
    const rect = wrap.getBoundingClientRect();
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = Math.max(280, rect.width), h = Math.max(180, rect.height);
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
  }
  new ResizeObserver(resize).observe(wrap); resize();
  function loop(now) {
    const raw = Math.min(0.1, (now - last) / 1000); last = now;
    if (s.phase === "play" || s.phase === "countdown") {
      acc += raw;
      while (acc >= FIXED) { step(FIXED); acc -= FIXED; }
    } else acc = 0;
    draw(now / 1000);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  renderHud();
  function mapPointer(clientY) {
    const rect = canvas.getBoundingClientRect();
    const scale = Math.min(rect.width / W, rect.height / H);
    const oy = (rect.height - H * scale) / 2;
    pointerY = Math.max(0, Math.min(H, (clientY - rect.top - oy) / scale));
  }
  canvas.addEventListener("pointerdown", (e) => {
    unlockAudio();
    canvas.setPointerCapture(e.pointerId);
    mapPointer(e.clientY);
    if (s.phase === "idle" || s.phase === "over") startMatch();
  });
  canvas.addEventListener("pointermove", (e) => {
    if (e.buttons === 0 && e.pointerType === "mouse") { mapPointer(e.clientY); return; }
    if (e.buttons > 0 || e.pointerType !== "mouse") mapPointer(e.clientY);
  });
  canvas.addEventListener("pointerup", (e) => { if (e.pointerType !== "mouse") pointerY = null; });
  canvas.addEventListener("pointercancel", () => { pointerY = null; });
  const GAME = new Set(["KeyW", "KeyS", "ArrowUp", "ArrowDown", "Space", "KeyP"]);
  addEventListener("keydown", (e) => {
    if (GAME.has(e.code)) e.preventDefault();
    keys.add(e.code);
    if (e.code === "Space" && (s.phase === "idle" || s.phase === "over")) startMatch();
    if ((e.code === "KeyP" || e.code === "Escape") && s.phase !== "idle" && s.phase !== "over") togglePause();
  });
  addEventListener("keyup", (e) => keys.delete(e.code));
  addEventListener("blur", () => keys.clear());
  document.addEventListener("visibilitychange", () => { if (document.hidden) keys.clear(); });
  muteBtn.addEventListener("click", () => {
    muted = !muted;
    muteBtn.textContent = muted ? "Sound" : "Mute";
    muteBtn.setAttribute("aria-label", muted ? "Unmute" : "Mute");
    if (master && audioCtx) master.gain.setTargetAtTime(muted ? 0 : 1, audioCtx.currentTime, 0.02);
  });
  pauseBtn.addEventListener("click", togglePause);
})();
</script>
</body>
</html>
